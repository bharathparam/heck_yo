<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Stylized Bus Body -->
  <g transform="translate(96, 88)">
    <!-- Main Bus Chassis -->
    <rect x="20" y="20" width="280" height="250" rx="44" fill="url(#busGrad)" filter="url(#glow)" />
    
    <!-- Windshield -->
    <rect x="44" y="48" width="232" height="100" rx="18" fill="#0f172a" />
    
    <!-- Windshield Glare Reflection -->
    <path d="M 60 56 L 140 56 L 80 136 L 50 136 Z" fill="#ffffff" opacity="0.12" />
    <path d="M 160 56 L 210 56 L 150 136 L 120 136 Z" fill="#ffffff" opacity="0.08" />
    
    <!-- Destination Display / Route Headsign -->
    <rect x="76" y="28" width="168" height="14" rx="5" fill="#0284c7" opacity="0.9" />

    <!-- Headlights -->
    <circle cx="70" cy="200" r="18" fill="#fef08a" opacity="0.95" />
    <circle cx="70" cy="200" r="26" fill="#facc15" opacity="0.3" />
    <circle cx="250" cy="200" r="18" fill="#fef08a" opacity="0.95" />
    <circle cx="250" cy="200" r="26" fill="#facc15" opacity="0.3" />

    <!-- Grille & Rail Accent -->
    <rect x="116" y="190" width="88" height="6" rx="3" fill="#ffffff" opacity="0.6" />
    <rect x="124" y="202" width="72" height="6" rx="3" fill="#ffffff" opacity="0.4" />
    <rect x="134" y="214" width="52" height="6" rx="3" fill="#ffffff" opacity="0.3" />

    <!-- Left & Right Mirrors -->
    <rect x="0" y="90" width="16" height="34" rx="6" fill="#38bdf8" />
    <rect x="304" y="90" width="16" height="34" rx="6" fill="#6366f1" />

    <!-- Wheels / Tracks -->
    <rect x="52" y="260" width="40" height="40" rx="10" fill="#020617" stroke="#334155" stroke-width="4" />
    <rect x="228" y="260" width="40" height="40" rx="10" fill="#020617" stroke="#334155" stroke-width="4" />
  </g>

  <!-- Ticket QR / Verification Checkmark Badge -->
  <g transform="translate(320, 310)">
    <circle cx="64" cy="64" r="56" fill="#10b981" />
    <circle cx="64" cy="64" r="52" fill="#065f46" />
    <path d="M42 66 L56 80 L88 48" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
